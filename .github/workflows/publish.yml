name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check Pages token
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [[ -z "$PAGES_TOKEN" ]]; then
            echo '::error::Set the PAGES_TOKEN repository secret before publishing.'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix source/web

      - name: Build site
        run: npm run build --prefix source/web
        env:
          # react-scripts treats existing lint warnings as build errors when CI=true.
          CI: 'false'

      - name: Check out Pages repository
        uses: actions/checkout@v4
        with:
          repository: snowboardsdb/snowboardsdb.github.io
          ref: main
          path: pages
          token: ${{ secrets.PAGES_TOKEN }}

      - name: Copy build
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            --exclude='/CNAME' \
            --exclude='/.nojekyll' \
            source/web/build/ pages/
          touch pages/.nojekyll

      - name: Commit and push changed files
        working-directory: pages
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'Pages content is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin HEAD:main
